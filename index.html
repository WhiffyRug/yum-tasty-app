<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yum Tasty !!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK script integration -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161c;
            --accent-gold: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #222;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .balance-card {
            background: var(--card-bg);
            border: 1px solid #2b2b36;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 10px 0;
        }
        .btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .task-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }
        .task-info {
            text-align: left;
        }
        .task-btn {
            background: var(--accent-gold);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111116;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222;
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: var(--accent-gold);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <span><b>Yum Tasty !!</b></span>
        <span id="userWallet">User...TON</span>
    </div>

    <!-- MINE / WALLET TAB -->
    <div id="tab-mine" class="tab-content active container">
        <div class="balance-card">
            <p style="color: var(--text-muted); margin:0;">TOTAL EARNINGS</p>
            <div class="balance-amount" id="balanceDisplay">$0.50</div>
            <p style="font-size: 13px; color: var(--text-muted);">Withdrawal Target: $25.00</p>
        </div>
        <button class="btn" onclick="requestWithdrawal()">WITHDRAW FUNDS</button>
    </div>

    <!-- TASKS & ADSGRAM MONETIZATION TAB -->
    <div id="tab-tasks" class="tab-content container">
        <h3>Earn Rewards</h3>
        <p style="color: var(--text-muted); font-size: 13px;">Watch ads or complete tasks to grow your balance.</p>
        
        <div class="task-item">
            <div class="task-info">
                <strong>Watch Rewarded Ad</strong><br>
                <span id="taskRewardText" style="color: var(--accent-gold); font-size: 14px;">+0.10$</span>
            </div>
            <button class="task-btn" onclick="showAdsgramAd()">Watch</button>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('mine', event)">⚡ Wallet</button>
        <button class="nav-item" onclick="switchTab('tasks', event)">📝 Earn</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Starts user with $0.50 instantly
        let balance = 0.50;

        // Initialize Adsgram banner controller (Replace 'YOUR_BLOCK_ID' with your actual block ID from Adsgram dashboard)
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

        function updateDisplay() {
            document.getElementById('balanceDisplay').innerText = '$' + balance.toFixed(2);
            
            // Dynamic reward reduction logic as user climbs toward $25
            let currentReward = 0.10;
            if (balance > 20.0) {
                currentReward = 0.002; // Reduced by /50 near the end
            } else if (balance > 15.0) {
                currentReward = 0.004; // Reduced by /25
            } else if (balance > 10.0) {
                currentReward = 0.01;  // Reduced by /10
            } else if (balance > 5.0) {
                currentReward = 0.02;  // Reduced by /5
            }
            document.getElementById('taskRewardText').innerText = '+' + currentReward.toFixed(3) + '$';
        }

        function getCalculatedReward() {
            if (balance > 20.0) return 0.002;
            if (balance > 15.0) return 0.004;
            if (balance > 10.0) return 0.01;
            if (balance > 5.0) return 0.02;
            return 0.10;
        }

        function showAdsgramAd() {
            if (adController) {
                adController.show().then((result) => {
                    // User finished watching the ad successfully -> Give reward
                    let reward = getCalculatedReward();
                    balance += reward;
                    updateDisplay();
                    tg.showAlert("Ad watched! Reward added to balance.");
                }).catch((result) => {
                    // User closed the ad early or error occurred
                    tg.showAlert("Ad skipped or failed to load. No reward given.");
                });
            } else {
                // Fallback simulation if testing locally outside Telegram/Adsgram SDK environment
                let reward = getCalculatedReward();
                balance += reward;
                updateDisplay();
                tg.showAlert("Task simulated! Reward added.");
            }
        }

        function requestWithdrawal() {
            if (balance < 25.0) {
                tg.showAlert("Minimum withdrawal threshold is $25.00! Keep completing tasks to unlock.");
            } else {
                tg.showAlert("Withdrawal pending: Network fee verification required.");
            }
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        updateDisplay();
    </script>
</body>
</html>
